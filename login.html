<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Giriş — Orange Tennis</title>
  <link rel="stylesheet" href="shared.css" />
  <style>
    body {
      min-height: 100vh;
      background: var(--black);
      color: #fff;
      display: flex;
      flex-direction: column;
    }
    main {
      flex: 1;
      display: grid;
      place-items: center;
      padding: 32px 20px 48px;
    }
    .card {
      width: 100%;
      max-width: 420px;
      background: var(--white);
      color: var(--text);
      border-radius: 28px;
      padding: 36px 32px;
      box-shadow: var(--shadow-lg);
    }
    .mark {
      width: 48px;
      height: 48px;
      border-radius: 14px;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, var(--orange), var(--orange-dark));
      color: #fff;
      font-weight: 700;
      margin-bottom: 18px;
    }
    h1 {
      font-family: var(--serif);
      font-weight: 400;
      font-size: 2.2rem;
      margin-bottom: 8px;
    }
    .sub { color: var(--muted); margin-bottom: 24px; line-height: 1.5; }
    label {
      display: block;
      font-size: 0.78rem;
      font-weight: 600;
      margin: 14px 0 8px;
    }
    input {
      width: 100%;
      padding: 14px 16px;
      border: 1.5px solid var(--border);
      border-radius: 14px;
      font-family: var(--sans);
      font-size: 1rem;
    }
    input:focus {
      outline: none;
      border-color: var(--orange);
      box-shadow: 0 0 0 4px rgba(255, 92, 0, 0.12);
    }
    button {
      width: 100%;
      margin-top: 22px;
      padding: 16px;
      border: none;
      border-radius: 999px;
      background: var(--orange);
      color: #fff;
      font-family: var(--sans);
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
    }
    .error {
      margin-top: 14px;
      color: var(--orange-dark);
      font-weight: 600;
      font-size: 0.92rem;
    }
    .back {
      display: inline-block;
      margin-top: 18px;
      color: var(--muted);
      text-decoration: none;
      font-size: 0.88rem;
    }
    .back:hover { color: var(--orange); }
  </style>
</head>
<body>
  <div class="demo-strip">Giriş · Orange Tennis Club</div>
  <main>
    <form class="card" id="login-form">
      <div class="mark">O</div>
      <h1>Giriş</h1>
      <p class="sub">Üye e-postası veya personel kullanıcı adı.</p>
      <label for="username">Kullanıcı adı veya e-posta</label>
      <input id="username" name="username" autocomplete="username" required />
      <label for="password">Şifre</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required />
      <button type="submit">Giriş</button>
      <p class="error" id="login-error" hidden></p>
      <a class="back" href="/kayit">Hesabınız yok mu? Kayıt ol</a>
    </form>
  </main>
  <script>
    const form = document.getElementById("login-form");
    const error = document.getElementById("login-error");
    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      error.hidden = true;
      const button = form.querySelector("button");
      button.disabled = true;
      try {
        const res = await fetch("/api/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            username: document.getElementById("username").value,
            password: document.getElementById("password").value
          })
        });
        const data = await res.json();
        if (!res.ok) {
          error.hidden = false;
          error.textContent = data.error || "Giriş yapılamadı.";
          return;
        }
        const next = new URLSearchParams(window.location.search).get("next");
        if (data.role === "staff") {
          window.location.href = "/admin";
        } else {
          window.location.href = next === "/booking.html" ? "/booking.html" : "/hesap";
        }
      } catch (err) {
        error.hidden = false;
        error.textContent = "Giriş yapılamadı. Sayfayı yenileyip tekrar deneyin.";
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
